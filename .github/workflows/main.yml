# Builds an UNSIGNED iOS .ipa on a GitHub-hosted Mac.
# Download it from the run's "Artifacts", then install it on your iPhone
# from Windows with Sideloadly (it signs the app with your Apple ID).
name: iOS IPA for Sideloadly

on:
  workflow_dispatch: # "Run workflow" button in the Actions tab

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Packages, icons and splash
        run: |
          flutter --version
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build iOS app (release, not signed)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Primeshows-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Primeshows-unsigned-ipa
          path: Primeshows-unsigned.ipa
          retention-days: 14
